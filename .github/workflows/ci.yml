name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      MARKET_DATA_PROVIDER: mock

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: excess
          POSTGRES_USER: excess
          POSTGRES_PASSWORD: excess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U excess -d excess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure environment
        run: |
          cp .env.example .env
          touch apps/web/.env.local

      - name: Generate and validate database client
        run: |
          pnpm db:generate
          pnpm --filter @excess/database db:validate
          pnpm db:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @excess/web exec playwright install --with-deps chromium

      - name: Test authenticated dashboard
        run: pnpm test:e2e

  deployment-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('vercel.json'))"
          pnpm typecheck:deployment

      - name: Build production API image
        run: docker build --file Dockerfile --tag excess-api:ci .

      - name: Validate k6 load profile
        run: docker run --rm -i grafana/k6:latest inspect - < ops/load/api.js
