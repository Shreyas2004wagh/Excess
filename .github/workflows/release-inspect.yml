name: Inspect release configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'Shreyas2004wagh/Excess' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect routing without exposing credentials or changing services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node ops/release/inspect.mjs
