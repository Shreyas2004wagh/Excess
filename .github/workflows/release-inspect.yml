name: Inspect release configuration

on:
  workflow_dispatch:
    inputs:
      compute_host:
        description: Optional direct compute hostname returned by Neon for this endpoint (read-only probe)
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'Shreyas2004wagh/Excess' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install the existing database client
        run: |
          psql --version
          pnpm install --frozen-lockfile
          pnpm db:generate
      - name: Inspect routing without exposing credentials or changing services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DIAGNOSTIC_COMPUTE_HOST: ${{ inputs.compute_host }}
        run: node ops/release/inspect.mjs
